<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Breuken en procenten</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../style.css">
<style>.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.1;margin:0 4px}
.fr i{font-style:normal;padding:0 6px;min-width:1.2em;text-align:center}.fr i:first-child{border-bottom:3px solid currentColor}
.bl{display:inline-block;min-width:1.3em;border-radius:8px;background:var(--sun);color:#1d2b45;padding:0 6px}
.bars{display:flex;gap:3px;max-width:320px;margin:10px auto 0}.bars b{flex:1;height:44px;border-radius:6px;border:3px solid var(--ink);background:var(--card)}.bars b.on{background:var(--coral)}
.sum2{font-size:36px;font-weight:800;text-align:center;margin:6px 0 12px;line-height:1.6}
.choices button{font-size:28px}
</style>
</head>
<body>
<main>
<a class="back" href="../index.html">← School</a>
<h2>Breuken en procenten ➗</h2>
<div id="b-setup" class="card">
<div class="cat">Wat ga je oefenen?</div><div class="chips" id="b-mode"></div>
<div class="cat">Niveau</div><div class="chips" id="b-lvl"></div>
<button class="btn" id="b-go">Start 🚀</button>
</div>
<div id="b-quiz" class="card" hidden>
<div class="bar"><div id="b-bar"></div></div>
<div class="sum2" id="b-q"></div>
<div id="b-numw"><div class="ans" id="b-a" aria-live="polite"></div><div class="pad" id="b-pad"></div></div>
<div class="choices" id="b-ch" hidden></div>
<p id="b-fb" style="text-align:center;font-size:22px;font-weight:800;min-height:32px;margin:10px 0 0"></p>
</div>
<div id="b-end" class="card" hidden>
<h2>Goed gedaan! 🎉</h2><div class="big" id="b-score"></div><p id="b-msg" style="text-align:center"></p>
<div class="row" style="justify-content:center"><button class="btn" id="b-again">Nog een keer 🔄</button><button class="btn alt" id="b-new">Andere sommen</button></div>
</div>
</main>
<script>
var $=function(s){return document.querySelector(s)},R=function(n){return Math.floor(Math.random()*n)};
function shuffle(a){return a.sort(function(){return Math.random()-.5})}
function chips(box,items,cur,set){box.innerHTML='';items.forEach(function(it){var b=document.createElement('button');b.className='chip';b.textContent=it.l;b.setAttribute('aria-pressed',it.v===cur()?'true':'false');b.onclick=function(){set(it.v);chips(box,items,cur,set)};box.appendChild(b)})}
var mode='alles',hard=false,Q,qi,score,buf='',lock=false;
function F(n,d){return '<span class="fr"><i>'+n+'</i><i>'+d+'</i></span>'}
var BL='<span class="bl">?</span>';
function pick(a){return a[R(a.length)]}
function bar(k,d){var h='<div class="bars">';for(var i=0;i<d;i++)h+='<b'+(i<k?' class="on"':'')+'></b>';return h+'</div>'}
var G={
herken:function(){var d=hard?2+R(9):pick([2,3,4,5,6]),k=1+R(d-1),set={};set[k+'/'+d]=1;
shuffle([(k+1)+'/'+d,(k-1)+'/'+d,(d-k)+'/'+d,k+'/'+(d+1),(k+1)+'/'+(d+1)]).forEach(function(x){var p=x.split('/').map(Number);if(p[0]>=1&&p[0]<p[1]&&Object.keys(set).length<4)set[x]=1});
return{q:'Welk deel is gekleurd?'+bar(k,d),a:k+'/'+d,ch:shuffle(Object.keys(set))}},
gelijk:function(){var d=pick(hard?[3,4,5,6,8]:[2,3,4,5]),n=1+R(d-1),m=pick(hard?[2,3,4,5,6]:[2,3,4]);return{q:F(n,d)+' = '+F(BL,d*m),a:String(n*m)}},
vergelijk:function(){var L=hard?[3,4,5,6,8,10]:[2,3,4,5,6],b=pick(L),d=pick(L),a=1+R(b-1),c=1+R(d-1),x=a*d,y=c*b;return{q:'Welk teken hoort er?<br>'+F(a,b)+' '+BL+' '+F(c,d),a:x<y?'<':x>y?'>':'=',ch:['<','=','>']}},
sommen:function(){var plus=R(2),d,a,b,m;
if(!hard){d=3+R(8);if(plus){a=1+R(d-1);b=1+R(d-a);return{q:F(a,d)+' + '+F(b,d)+' = '+F(BL,d),a:String(a+b)}}a=2+R(d-1);b=1+R(a-1);return{q:F(a,d)+' − '+F(b,d)+' = '+F(BL,d),a:String(a-b)}}
d=pick([2,3,4,5]);m=pick([2,3]);a=1+R(d-1);if(plus){b=1+R(d*m-1);return{q:F(a,d)+' + '+F(b,d*m)+' = '+F(BL,d*m),a:String(a*m+b)}}b=1+R(a*m-1);return{q:F(a,d)+' − '+F(b,d*m)+' = '+F(BL,d*m),a:String(a*m-b)}},
proc:function(){if(R(2)){var d=pick(hard?[2,4,5,10,20,25,50]:[2,4,5,10]),n=1+R(d-1);return{q:F(n,d)+' = '+BL+' %',a:String(n*100/d)}}
var p=pick(hard?[5,10,20,25,50,75]:[10,25,50]),N=pick([20,40,60,80,100,120,200]);return{q:p+'% van '+N+' = '+BL,a:String(p*N/100)}}};
var MODES=[{l:'🍕 Herkennen',v:'herken'},{l:'🟰 Gelijkwaardig',v:'gelijk'},{l:'⚖️ Vergelijken',v:'vergelijk'},{l:'➕ Optellen en aftrekken',v:'sommen'},{l:'％ Procenten',v:'proc'},{l:'🔀 Alles',v:'alles'}];
chips($('#b-mode'),MODES,function(){return mode},function(v){mode=v});
chips($('#b-lvl'),[{l:'Makkelijk',v:false},{l:'Lastiger',v:true}],function(){return hard},function(v){hard=v});
function show(id){['b-setup','b-quiz','b-end'].forEach(function(x){$('#'+x).hidden=x!==id})}
function lab(c){return c==='<'?'&lt;':c==='>'?'&gt;':c.indexOf('/')>0?F.apply(null,c.split('/')):c}
function start(){Q=[];var ks=Object.keys(G);for(var i=0;i<10;i++)Q.push(G[mode==='alles'?pick(ks):mode]());qi=0;score=0;show('b-quiz');ask()}
function ask(){buf='';lock=false;var q=Q[qi];$('#b-bar').style.width=(qi*10)+'%';$('#b-q').innerHTML=q.q;$('#b-fb').textContent='';$('#b-numw').hidden=!!q.ch;$('#b-ch').hidden=!q.ch;$('#b-a').textContent='';$('#b-a').className='ans';
if(q.ch){var b=$('#b-ch');b.innerHTML='';q.ch.forEach(function(c){var x=document.createElement('button');x.innerHTML=lab(c);x.onclick=function(){answer(c,x)};b.appendChild(x)})}}
function answer(v,el){if(lock)return;lock=true;var q=Q[qi],ok=v===q.a,f=$('#b-fb');
if(ok){score++;f.textContent='✓ Goed!';f.style.color='var(--mint)'}else{f.innerHTML='✗ Het antwoord is '+lab(q.a)+(q.ch?'':'');f.style.color='var(--coral)'}
if(el)el.style.background=ok?'var(--ok)':'var(--bad)';else $('#b-a').className='ans '+(ok?'ok':'bad');
setTimeout(function(){qi++;if(qi>=10)end();else ask()},ok?800:2200)}
var pad=$('#b-pad');['1','2','3','4','5','6','7','8','9','⌫','0','OK'].forEach(function(k){var b=document.createElement('button');b.textContent=k;b.dataset.k=k;pad.appendChild(b)});
pad.onclick=function(e){var k=e.target.dataset.k;if(!k||lock)return;if(k==='⌫')buf=buf.slice(0,-1);else if(k==='OK'){if(buf)answer(buf,null);return}else if(buf.length<3)buf+=k;$('#b-a').textContent=buf};
function end(){show('b-end');$('#b-score').textContent=score+' van 10 goed';$('#b-msg').textContent=score===10?'Alles goed! Wat een topper.':score>=7?'Knap gerekend!':'Blijf oefenen, het wordt steeds beter.'}
$('#b-go').onclick=start;$('#b-again').onclick=start;$('#b-new').onclick=function(){show('b-setup')};
</script>
</body>
</html>
