<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Klok kijken</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>

<a class="back" href="../index.html">← School</a>
<h2>Klok kijken</h2>
<div class="chips" id="k-mode">
<button class="chip" data-m="play" aria-pressed="true">Verken</button>
<button class="chip" data-m="quiz" aria-pressed="false">Oefen</button>
</div>
<svg id="clock" viewBox="-110 -110 220 220" style="width:100%;max-width:320px;display:block;margin:0 auto;touch-action:none" role="img" aria-label="Analoge klok"></svg>
<div class="card" style="margin-top:14px">
<div id="k-play">
<div class="big" id="k-dig"></div>
<p id="k-words" style="text-align:center;margin:0">Sleep de grote wijzer rond.</p>
</div>
<div id="k-quiz" hidden>
<div class="chips" id="k-lvl"></div>
<p id="k-q" style="text-align:center">Hoe laat is het?</p>
<div class="choices" id="k-ch"></div>
<p id="k-fb" style="text-align:center;margin:10px 0 0;min-height:28px"></p>
</div>
</div>

</main>
<script>
var $=function(s){return document.querySelector(s)},R=function(n){return Math.floor(Math.random()*n)};
var H=3,M=0,clock=$('#clock'),mode='play',ans=null;
(function(){var g='<circle r="104" fill="var(--card)" stroke="var(--ink)" stroke-width="6"/>';
for(var i=0;i<60;i++){var a=i*6*Math.PI/180,l=i%5?4:10;g+='<line x1="'+(Math.sin(a)*(98-l)).toFixed(1)+'" y1="'+(-Math.cos(a)*(98-l)).toFixed(1)+'" x2="'+(Math.sin(a)*98).toFixed(1)+'" y2="'+(-Math.cos(a)*98).toFixed(1)+'" stroke="var(--ink)" stroke-width="'+(i%5?1:3)+'"/>'}
for(i=1;i<=12;i++){a=i*30*Math.PI/180;g+='<text x="'+(Math.sin(a)*74).toFixed(1)+'" y="'+(-Math.cos(a)*74+8).toFixed(1)+'" text-anchor="middle" font-size="24" fill="var(--ink)">'+i+'</text>'}
g+='<line id="hh" y2="-48" stroke="var(--coral)" stroke-width="9" stroke-linecap="round"/><line id="mh" y2="-80" stroke="var(--vio)" stroke-width="6" stroke-linecap="round"/><circle id="knob" cy="-80" r="12" fill="var(--vio)" opacity=".25"/><circle r="6" fill="var(--ink)"/>';
clock.innerHTML=g})();
function pos(){$('#hh').setAttribute('transform','rotate('+(((H%12)+M/60)*30)+')');$('#mh').setAttribute('transform','rotate('+(M*6)+')');$('#knob').setAttribute('transform','rotate('+(M*6)+')')}
function h12(h){return h%12||12}
function dig(h,m){return h12(h)+':'+(m<10?'0':'')+m}
function words(h,m){var a=h12(h),b=h12(h+1);
if(m===0)return a+' uur';if(m===15)return 'kwart over '+a;if(m===30)return 'half '+b;if(m===45)return 'kwart voor '+b;
if(m<15)return m+' over '+a;if(m<30)return (30-m)+' voor half '+b;if(m<45)return (m-30)+' over half '+b;return (60-m)+' voor '+b}
function showPlay(){pos();$('#k-dig').textContent=dig(H,M);$('#k-words').textContent=words(H,M)}
var drag=false;
function move(e){if(!drag||mode!=='play')return;var r=clock.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
var m=(Math.round(((Math.atan2(dx,-dy)*180/Math.PI+360)%360)/6))%60;
if(M>45&&m<15)H=(H+1)%24;else if(M<15&&m>45)H=(H+23)%24;M=m;showPlay()}
clock.addEventListener('pointerdown',function(e){drag=true;clock.setPointerCapture(e.pointerId);move(e)});
clock.addEventListener('pointermove',move);
clock.addEventListener('pointerup',function(){drag=false});
$('#k-mode').onclick=function(e){var b=e.target.closest('.chip');if(!b)return;mode=b.dataset.m;
document.querySelectorAll('#k-mode .chip').forEach(function(c){c.setAttribute('aria-pressed',c===b?'true':'false')});
$('#k-play').hidden=mode!=='play';$('#k-quiz').hidden=mode!=='quiz';if(mode==='play')showPlay();else newQ()};
var lvls=['Hele uren','Halve uren','Kwartieren','5 minuten'],lv=0,steps=[[0],[0,30],[0,15,30,45],[0,5,10,15,20,25,30,35,40,45,50,55]];
var lb=$('#k-lvl');lvls.forEach(function(n,i){var b=document.createElement('button');b.className='chip';b.textContent=n;b.dataset.i=i;lb.appendChild(b)});
lb.onclick=function(e){var b=e.target.closest('.chip');if(!b)return;lv=+b.dataset.i;newQ()};
function newQ(){document.querySelectorAll('#k-lvl .chip').forEach(function(c){c.setAttribute('aria-pressed',+c.dataset.i===lv?'true':'false')});
var st=steps[lv];H=1+R(12);M=st[R(st.length)];pos();ans=dig(H,M);
var set={};set[ans]=1;var tries=0;while(Object.keys(set).length<4&&tries++<50){var h=R(3)?H:1+R(12),m=R(2)?M:st[R(st.length)];set[dig(h,m)]=1}
var o=Object.keys(set).sort(function(){return Math.random()-.5});
var box=$('#k-ch');box.innerHTML='';o.forEach(function(t){var b=document.createElement('button');b.textContent=t;box.appendChild(b)});$('#k-fb').textContent=''}
$('#k-ch').onclick=function(e){var b=e.target.closest('button');if(!b)return;
if(b.textContent===ans){$('#k-fb').textContent='Goed! '+words(H,M)+' ✓';setTimeout(newQ,1200)}else{b.style.background='var(--bad)';$('#k-fb').textContent='Probeer het nog eens.'}};
showPlay();
</script>
</body>
</html>
