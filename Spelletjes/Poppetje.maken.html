<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poppetje Maken • Gezinshub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f4f7fb;
            background-image: radial-gradient(#dce5f2 1.4px, transparent 1.4px);
            background-size: 24px 24px;
            color: #1e293b;
        }

        /* Subtiele zweef- en klikanimaties voor het poppetje en de kaarten */
        @keyframes popIn {
            0% { transform: scale(0.95); opacity: 0.7; }
            70% { transform: scale(1.02); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .avatar-pop {
            animation: popIn 0.24s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* Verberg standaard scrollbar bij horizontale categorie-tabs */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .option-card {
            transition: transform 0.14s ease, box-shadow 0.14s ease, border-color 0.14s ease, background-color 0.14s ease;
        }
        .option-card:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Bovenste navigatiebalk passend bij de Gezinshub -->
    <header class="w-full max-w-6xl mx-auto px-4 pt-4 pb-2 flex items-center justify-between gap-3 flex-wrap">
        <a href="../index.html" class="inline-flex items-center gap-2 px-4 py-2.5 bg-white hover:bg-slate-50 text-slate-800 font-bold text-sm rounded-2xl border border-slate-200/90 shadow-sm transition active:scale-95">
            <span>←</span>
            <span>Terug naar Gezinshub</span>
        </a>
        <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-pink-100 text-pink-700 font-extrabold text-xs uppercase tracking-wider">
            <span>✨</span>
            <span>Aankleed & Ontwerp Studio</span>
        </div>
    </header>

    <!-- Titelblok -->
    <section class="w-full max-w-6xl mx-auto px-4 pt-1 pb-4">
        <h1 class="text-2xl sm:text-3xl md:text-4xl font-black tracking-tight text-slate-900 flex items-center gap-2.5">
            <span>🧍‍♀️</span>
            <span>Poppetje Maken</span>
        </h1>
        <p class="text-slate-500 text-sm sm:text-base mt-1 font-medium">
            Kies een kapsel, leuke kleren, sieraden en vrolijke details om jouw eigen poppetje samen te stellen!
        </p>
    </section>

    <!-- Hoofdgedeelte: Links (boven op mobiel) het poppetje, Rechts (onder op mobiel) de keuzecategorieën -->
    <main class="w-full max-w-6xl mx-auto px-4 pb-12 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">

        <!-- LINKERKOLOM: Live SVG Poppetje + Achtergrond + Actieknoppen -->
        <div class="lg:col-span-5 bg-white rounded-3xl p-4 sm:p-5 shadow-lg shadow-slate-200/70 border border-slate-200/80 lg:sticky lg:top-4">
            
            <!-- Achtergrondkiezer boven het podium -->
            <div class="flex items-center justify-between gap-2 mb-3 flex-wrap">
                <span class="text-xs font-extrabold uppercase tracking-wider text-slate-400">Achtergrond</span>
                <div id="bg-selector" class="flex items-center gap-1.5 flex-wrap"></div>
            </div>

            <!-- Podium met het volledige SVG-poppetje -->
            <div class="relative w-full aspect-[4/5] max-h-[470px] mx-auto rounded-2xl overflow-hidden border-2 border-slate-200/90 shadow-inner bg-sky-100 flex items-center justify-center">
                <svg id="character-svg" viewBox="0 0 360 460" xmlns="http://www.w3.org/2000/svg" class="w-full h-full select-none">
                    <defs>
                        <!-- Regenboog verloop voor haar & kleding -->
                        <linearGradient id="rainbowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ff7eb3"/>
                            <stop offset="25%" stop-color="#ffd166"/>
                            <stop offset="50%" stop-color="#06d6a0"/>
                            <stop offset="75%" stop-color="#4ea8de"/>
                            <stop offset="100%" stop-color="#b5179e"/>
                        </linearGradient>
                        <!-- Sterrenhemel verloop -->
                        <linearGradient id="nightSkyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#1e1b4b"/>
                            <stop offset="60%" stop-color="#312e81"/>
                            <stop offset="100%" stop-color="#4c1d95"/>
                        </linearGradient>
                        <!-- Hemelsblauw verloop -->
                        <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#bae6fd"/>
                            <stop offset="100%" stop-color="#f0f9ff"/>
                        </linearGradient>
                        <!-- Grasveld verloop -->
                        <linearGradient id="meadowSkyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#bae6fd"/>
                            <stop offset="72%" stop-color="#e0f2fe"/>
                            <stop offset="72%" stop-color="#86efac"/>
                            <stop offset="100%" stop-color="#4ade80"/>
                        </linearGradient>
                        <!-- Schaduw onder voeten -->
                        <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="rgba(15, 23, 42, 0.20)"/>
                            <stop offset="100%" stop-color="rgba(15, 23, 42, 0)"/>
                        </radialGradient>
                    </defs>

                    <!-- LAAG 1: Achtergrond -->
                    <g id="layer-background"></g>

                    <!-- Vloerschaduw -->
                    <ellipse cx="180" cy="404" rx="74" ry="12" fill="url(#floorShadow)"/>

                    <!-- LAAG 2: Achterkant haar (lang haar / staarten achter lichaam) -->
                    <g id="layer-hair-back"></g>

                    <!-- LAAG 3: Lichaam (nek, romp, armen, handen, benen) -->
                    <g id="layer-body"></g>

                    <!-- LAAG 4: Sokken & Schoenen -->
                    <g id="layer-shoes"></g>

                    <!-- LAAG 5: Broek / Rok (onderkleding) -->
                    <g id="layer-bottoms"></g>

                    <!-- LAAG 6: Shirt / Trui / Jurk (bovenkleding) -->
                    <g id="layer-tops"></g>

                    <!-- LAAG 7: Sieraden op lichaam (ketting & armband) -->
                    <g id="layer-jewelry-body"></g>

                    <!-- LAAG 8: Hoofd & Oren -->
                    <g id="layer-head"></g>

                    <!-- LAAG 9: Oorbellen -->
                    <g id="layer-earrings"></g>

                    <!-- LAAG 10: Gezicht (blosjes, sproetjes, ogen, wenkbrauwen, neus, mond) -->
                    <g id="layer-face"></g>

                    <!-- LAAG 11: Voorkant haar & Pony -->
                    <g id="layer-hair-front"></g>

                    <!-- LAAG 12: Brillen & Hoofddeksels -->
                    <g id="layer-headwear"></g>

                    <!-- LAAG 13: Extra accessoires (in de hand of huisdier ernaast) -->
                    <g id="layer-extras"></g>

                    <!-- LAAG 14: Naamkaartje onderaan in het podium -->
                    <g id="layer-nametag"></g>
                </svg>
            </div>

            <!-- Naam invoerveld -->
            <div class="mt-3.5">
                <label for="character-name" class="block text-xs font-extrabold uppercase tracking-wider text-slate-400 mb-1">
                    Naam van je poppetje
                </label>
                <input
                    type="text"
                    id="character-name"
                    maxlength="24"
                    placeholder="Bijv. Super Fien, Sara, Prinses..."
                    class="w-full px-3.5 py-2.5 rounded-2xl border-2 border-slate-200 bg-slate-50 focus:bg-white focus:border-indigo-500 outline-none font-bold text-slate-800 text-sm sm:text-base transition"
                >
            </div>

            <!-- Actieknoppen: Verras me, Opnieuw, Opslaan als plaatje -->
            <div class="mt-3 grid grid-cols-2 gap-2.5">
                <button type="button" id="btn-random" class="flex items-center justify-center gap-2 py-2.5 px-3 rounded-2xl bg-amber-400 hover:bg-amber-500 text-slate-900 font-extrabold text-sm shadow-sm transition active:scale-95">
                    <span>🎲</span>
                    <span>Verras me!</span>
                </button>
                <button type="button" id="btn-reset" class="flex items-center justify-center gap-2 py-2.5 px-3 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-extrabold text-sm transition active:scale-95">
                    <span>🔄</span>
                    <span>Opnieuw</span>
                </button>
            </div>

            <button type="button" id="btn-download" class="mt-2.5 w-full flex items-center justify-center gap-2 py-3 px-4 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-sm sm:text-base shadow-md shadow-indigo-200 transition active:scale-95">
                <span>📸</span>
                <span>Opslaan als plaatje</span>
            </button>

            <!-- Melding bij opslaan -->
            <div id="save-feedback" class="hidden mt-2.5 px-3 py-2 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs font-bold text-center">
                🎉 Gelukt! Jouw poppetje is gedownload als plaatje.
            </div>
        </div>

        <!-- RECHTERKOLOM: Categorie-tabbladen & Keuze-opties -->
        <div class="lg:col-span-7 bg-white rounded-3xl p-4 sm:p-6 shadow-lg shadow-slate-200/70 border border-slate-200/80">
            
            <!-- Navigatie-tabs voor de 6 categorieën -->
            <div id="category-tabs" class="flex gap-2 overflow-x-auto no-scrollbar pb-3 mb-4 border-b border-slate-100"></div>

            <!-- Dynamische inhoud voor het gekozen tabblad -->
            <div id="tab-content" class="space-y-6"></div>

        </div>
    </main>
