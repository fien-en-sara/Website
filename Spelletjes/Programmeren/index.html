<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Robot programmeren</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../style.css">
<style>.gr{display:grid;gap:3px;max-width:420px;margin:0 auto 12px;padding:6px;background:var(--ink);border-radius:14px}
.ce{aspect-ratio:1;border-radius:8px;background:#cfe9d6;display:flex;align-items:center;justify-content:center;font-size:clamp(18px,6vw,30px);position:relative}
.ce.w{background:#394867}.ce.bot{background:#fff3c4}.ce.bad{background:#ffb3a8}
.ce small{position:absolute;top:1px;right:3px;font-size:13px;color:#2f6fed}
.prog{min-height:96px;border:3px dashed var(--line);border-radius:16px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start;margin-bottom:10px}
.blk{background:var(--vio);color:#fff;border-radius:10px;padding:5px 10px;font-weight:700;font-size:17px}
.rep{background:var(--sun);color:#1d2b45;border-radius:12px;padding:6px;display:flex;gap:5px;align-items:center;flex-wrap:wrap;border:3px solid transparent;cursor:pointer}
.rep.act{border-color:var(--ink)}.rep .blk{background:#fff;color:#1d2b45}
.rep button{border:2px solid var(--ink);background:#fff;border-radius:8px;font-weight:800;padding:0 8px;color:#1d2b45}
.pal button{font-size:17px;padding:9px 12px}
</style>
</head>
<body>
<main>
<a class="back" href="../index.html">← Spelletjes</a>
<h2>Robot programmeren 🤖</h2>
<div class="chips" id="g-lv"></div>
<p id="g-tip" style="margin:0 0 8px"></p>
<div class="gr" id="g-grid" role="img" aria-label="Het speelveld"></div>
<div class="row" style="justify-content:space-between"><b id="g-cnt"></b><span style="font-size:15px;opacity:.8">Tik op een herhaal-blok om er blokken in te zetten.</span></div>
<div class="prog" id="g-prog" aria-label="Jouw programma"></div>
<div class="row pal" style="margin-bottom:10px"><button class="btn alt" data-c="F">⬆️ Vooruit</button><button class="btn alt" data-c="L">↰ Links</button><button class="btn alt" data-c="R">↱ Rechts</button><button class="btn" data-c="rep" style="background:var(--sun);color:#1d2b45">🔁 Herhaal</button><button class="chip" data-c="del">⌫</button><button class="chip" data-c="clr">🗑️ Leeg</button></div>
<div class="row"><button class="btn" id="g-run" style="background:var(--mint)">▶️ Start</button><button class="btn" id="g-next" hidden>Volgend level ➡️</button></div>
<p id="g-msg" style="font-size:22px;font-weight:800;min-height:34px;margin:10px 0 0"></p>
</main>
<script>
var $=function(s){return document.querySelector(s)},R=function(n){return Math.floor(Math.random()*n)};
function shuffle(a){return a.sort(function(){return Math.random()-.5})}
function chips(box,items,cur,set){box.innerHTML='';items.forEach(function(it){var b=document.createElement('button');b.className='chip';b.textContent=it.l;b.setAttribute('aria-pressed',it.v===cur()?'true':'false');b.onclick=function(){set(it.v);chips(box,items,cur,set)};box.appendChild(b)})}
var LV=[
{r:['.....','.....','S...G','.....','.....'],d:1,lim:99,t:'Breng de robot naar de vlag 🏁. Tip: met Herhaal hoef je niet elke stap apart te plaatsen.'},
{r:['....G','.....','.....','.....','S....'],d:1,lim:5,t:'Je mag maar 5 blokken gebruiken. Herhaal helpt!'},
{r:['####G','###..','##..#','#..##','S.###'],d:1,lim:5,t:'Een trap! Welk stukje komt steeds terug? Maximaal 5 blokken.'},
{r:['S.####','#..###','##..##','###..#','####..','#####G'],d:1,lim:5,t:'Weer een trap, nu naar beneden. Maximaal 5 blokken.'},
{r:['......','......','S.##.G','......','......','......'],d:1,lim:99,t:'Loop om de muur heen.'},
{r:['S.#....','.##.##.','...#...','.#...#.','.#.###.','.#...#.','...#..G'],d:2,lim:99,t:'Een doolhof! De robot kijkt nu naar beneden. Het kan met minder blokken als je Herhaal slim gebruikt.'}];
var DX=[0,1,0,-1],DY=[-1,0,1,0],AR=['▲','▶','▼','◀'],NAME={F:'⬆️ Vooruit',L:'↰ Links',R:'↱ Rechts'};
var lv=0,g,gw,gh,st,goal,prog=[],into=-1,busy=false,tm,best=0;
try{best=+localStorage.getItem('robot-level')||0}catch(e){}
function lvChips(){chips($('#g-lv'),LV.map(function(x,i){return{l:'Level '+(i+1),v:i}}),function(){return lv},function(v){load(v)})}
function load(n){clearTimeout(tm);busy=false;lv=n;var L=LV[n];g=L.r.map(function(r){return r.split('')});gh=g.length;gw=g[0].length;
for(var y=0;y<gh;y++)for(var x=0;x<gw;x++){if(g[y][x]==='S'){st={x:x,y:y,d:L.d};g[y][x]='.'}if(g[y][x]==='G'){goal={x:x,y:y};g[y][x]='.'}}
prog=[];into=-1;$('#g-tip').textContent=L.t;$('#g-msg').textContent='';$('#g-next').hidden=true;$('#g-run').disabled=false;lvChips();draw(st);list()}
function draw(b,bad){var el=$('#g-grid');el.style.gridTemplateColumns='repeat('+gw+',1fr)';el.innerHTML='';
for(var y=0;y<gh;y++)for(var x=0;x<gw;x++){var c=document.createElement('div');c.className='ce'+(g[y][x]==='#'?' w':'');
if(x===goal.x&&y===goal.y)c.textContent='🏁';if(x===b.x&&y===b.y){c.className+=' bot'+(bad?' bad':'');c.innerHTML='🤖<small>'+AR[b.d]+'</small>'}el.appendChild(c)}}
function cnt(){return prog.reduce(function(n,it){return n+1+(it.c==='rep'?it.b.length:0)},0)}
function list(){var box=$('#g-prog');box.innerHTML='';if(!prog.length)box.innerHTML='<span style="opacity:.6">Zet hier je blokken neer.</span>';
prog.forEach(function(it,i){if(it.c!=='rep'){var s=document.createElement('span');s.className='blk';s.textContent=NAME[it.c];box.appendChild(s);return}
var r=document.createElement('div');r.className='rep'+(into===i?' act':'');r.onclick=function(){into=into===i?-1:i;list()};
r.appendChild(document.createTextNode('🔁 '));var n=document.createElement('button');n.textContent=it.n+'×';n.setAttribute('aria-label','aantal keer');n.onclick=function(e){e.stopPropagation();it.n=it.n>=9?2:it.n+1;list()};r.appendChild(n);
it.b.forEach(function(c){var s=document.createElement('span');s.className='blk';s.textContent=NAME[c];r.appendChild(s)});if(!it.b.length&&into===i)r.appendChild(document.createTextNode('…'));box.appendChild(r)});
var L=LV[lv].lim;$('#g-cnt').textContent='Blokken: '+cnt()+(L<99?' van '+L:'')}
document.querySelector('.pal').onclick=function(e){var b=e.target.closest('button');if(!b||busy)return;var c=b.dataset.c;
if(c==='clr'){prog=[];into=-1}
else if(c==='del'){if(into>=0){if(prog[into].b.length)prog[into].b.pop();else{prog.splice(into,1);into=-1}}else prog.pop()}
else if(c==='rep'){prog.push({c:'rep',n:2,b:[]});into=prog.length-1}
else if(into>=0)prog[into].b.push(c);else prog.push({c:c});list()};
function run(){if(busy)return;if(!prog.length){$('#g-msg').textContent='Bouw eerst een programma.';return}if(cnt()>LV[lv].lim){$('#g-msg').textContent='Te veel blokken! Gebruik Herhaal.';return}
var out=[];prog.forEach(function(it){if(it.c==='rep'){for(var k=0;k<it.n;k++)out=out.concat(it.b)}else out.push(it.c)});
var b={x:st.x,y:st.y,d:st.d},k=0;busy=true;$('#g-msg').textContent='';$('#g-next').hidden=true;draw(b);
function fail(m){$('#g-msg').textContent=m;draw(b,true);tm=setTimeout(function(){busy=false;draw(st)},1600)}
function step(){if(k>=out.length){if(b.x===goal.x&&b.y===goal.y)return win();return fail('Net niet! De robot staat nog niet op de vlag.')}
var c=out[k++];if(c==='L')b.d=(b.d+3)%4;else if(c==='R')b.d=(b.d+1)%4;else{var nx=b.x+DX[b.d],ny=b.y+DY[b.d];if(nx<0||ny<0||nx>=gw||ny>=gh||g[ny][nx]==='#')return fail('Au! Daar kun je niet heen.');b.x=nx;b.y=ny}
draw(b);if(b.x===goal.x&&b.y===goal.y)return win();tm=setTimeout(step,320)}
function win(){busy=false;$('#g-msg').textContent='🎉 Gelukt met '+cnt()+' blokken!';if(lv<LV.length-1)$('#g-next').hidden=false;else $('#g-msg').textContent+=' Je hebt alle levels gehaald!';try{if(lv+1>best)localStorage.setItem('robot-level',lv+1)}catch(e){}}
tm=setTimeout(step,300)}
$('#g-run').onclick=run;$('#g-next').onclick=function(){load(lv+1)};
load(Math.min(best,LV.length-1));
</script>
</body>
</html>
