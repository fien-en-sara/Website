<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tafels Oefenen</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --accent: #38bdf8;
      --green: #22c55e;
      --red: #ef4444;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem;
    }
    header {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    .back-btn {
      color: var(--subtext);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .back-btn:hover {
      color: var(--accent);
    }
    .stats {
      font-size: 0.9rem;
      color: var(--accent);
      font-weight: 600;
    }
    .card {
      background-color: var(--card-bg);
      border-radius: 1.25rem;
      padding: 1.75rem;
      width: 100%;
      max-width: 480px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Start / Selectie Scherm */
    .table-picker-title {
      font-size: 1.2rem;
      margin-bottom: 1rem;
      text-align: center;
    }
    .table-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.6rem;
      width: 100%;
      margin-bottom: 1.25rem;
    }
    .btn-table {
      background: #334155;
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.75rem;
      border-radius: 0.6rem;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-table.selected {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }
    .btn-all {
      grid-column: span 4;
      background: #475569;
    }
    .start-btn {
      width: 100%;
      background: var(--green);
      color: white;
      border: none;
      padding: 1rem;
      border-radius: 0.75rem;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
    }

    /* Spelscherm */
    .question-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      font-size: 2.8rem;
      font-weight: 700;
      margin: 1rem 0 1.5rem;
      min-height: 4rem;
    }
    .answer-display {
      min-width: 80px;
      border-bottom: 4px solid var(--accent);
      text-align: center;
      color: var(--accent);
      min-height: 3.5rem;
    }
    .answer-display.correct {
      color: var(--green);
      border-color: var(--green);
    }
    .answer-display.wrong {
      color: var(--red);
      border-color: var(--red);
    }

    /* Numpad */
    .numpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.6rem;
      width: 100%;
      max-width: 340px;
    }
    .num-btn {
      background: #334155;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: white;
      font-size: 1.5rem;
      font-weight: 600;
      padding: 0.9rem;
      border-radius: 0.6rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .num-btn:active {
      background: #475569;
      transform: scale(0.97);
    }
    .num-btn.submit {
      background: var(--green);
      color: white;
      font-size: 1.25rem;
    }
    .num-btn.delete {
      background: #475569;
      font-size: 1.1rem;
    }

    /* Resultaatscherm */
    .result-score {
      font-size: 3rem;
      font-weight: 800;
      color: var(--accent);
      margin: 1.5rem 0 0.5rem;
    }
    .result-msg {
      color: var(--subtext);
      margin-bottom: 2rem;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <header>
    <a href="../index.html" class="back-btn">← Gezinshub</a>
    <div class="stats" id="stats">Vraag: 1/10</div>
  </header>

  <!-- SCHERM 1: TAFEL KIEZEN -->
  <div class="card" id="screen-select">
    <div class="table-picker-title">Kies een tafel om te oefenen:</div>
    <div class="table-grid" id="table-buttons">
      <!-- Knoppen 1 t/m 12 worden via JS gegenereerd -->
      <button class="btn-table btn-all selected" data-table="all">Alle tafels door elkaar</button>
    </div>
    <button class="start-btn" id="start-btn">Start met Oefenen! 🚀</button>
  </div>

  <!-- SCHERM 2: REKENSPEL -->
  <div class="card" id="screen-game" style="display: none;">
    <div class="question-box">
      <span id="question-text">7 × 8 =</span>
      <span class="answer-display" id="answer-box">?</span>
    </div>

    <div class="numpad">
      <button class="num-btn" data-val="1">1</button>
      <button class="num-btn" data-val="2">2</button>
      <button class="num-btn" data-val="3">3</button>
      <button class="num-btn" data-val="4">4</button>
      <button class="num-btn" data-val="5">5</button>
      <button class="num-btn" data-val="6">6</button>
      <button class="num-btn" data-val="7">7</button>
      <button class="num-btn" data-val="8">8</button>
      <button class="num-btn" data-val="9">9</button>
      <button class="num-btn delete" id="btn-back">⌫</button>
      <button class="num-btn" data-val="0">0</button>
      <button class="num-btn submit" id="btn-ok">OK</button>
    </div>
  </div>

  <!-- SCHERM 3: RESULTATEN -->
  <div class="card" id="screen-results" style="display: none;">
    <h2>Goed gedaan! 🎉</h2>
    <div class="result-score" id="result-score">8 / 10</div>
    <p class="result-msg" id="result-msg">Knap gerekend!</p>
    <button class="start-btn" id="restart-btn">Nog een keer 🔄</button>
  </div>

  <script>
    // State
    let selectedTable = 'all';
    let currentQuestion = 0;
    const totalQuestions = 10;
    let score = 0;
    let num1 = 0;
    let num2 = 0;
    let currentInput = "";
    let isChecking = false;

    // Elementen
    const screenSelect = document.getElementById('screen-select');
    const screenGame = document.getElementById('screen-game');
    const screenResults = document.getElementById('screen-results');
    const tableButtons = document.getElementById('table-buttons');
    const startBtn = document.getElementById('start-btn');
    const statsEl = document.getElementById('stats');
    const questionText = document.getElementById('question-text');
    const answerBox = document.getElementById('answer-box');
    const resultScore = document.getElementById('result-score');
    const resultMsg = document.getElementById('result-msg');
    const restartBtn = document.getElementById('restart-btn');

    // Genereer tafel knoppen 1 t/m 12
    for (let i = 1; i <= 12; i++) {
      const b = document.createElement('button');
      b.className = 'btn-table';
      b.textContent = i;
      b.dataset.table = i;
      b.addEventListener('click', () => selectTable(i, b));
      tableButtons.insertBefore(b, tableButtons.lastElementChild);
    }

    const allBtn = document.querySelector('.btn-all');
    allBtn.addEventListener('click', () => selectTable('all', allBtn));

    function selectTable(val, element) {
      selectedTable = val;
      document.querySelectorAll('.btn-table').forEach(b => b.classList.remove('selected'));
      element.classList.add('selected');
    }

    // Start spel
    startBtn.addEventListener('click', () => {
      screenSelect.style.display = 'none';
      screenResults.style.display = 'none';
      screenGame.style.display = 'flex';
      currentQuestion = 0;
      score = 0;
      nextQuestion();
    });

    restartBtn.addEventListener('click', () => {
      screenResults.style.display = 'none';
      screenSelect.style.display = 'flex';
      statsEl.textContent = 'Kies een tafel';
    });

    function nextQuestion() {
      if (currentQuestion >= totalQuestions) {
        showResults();
        return;
      }
      isChecking = false;
      currentQuestion++;
      statsEl.textContent = `Vraag: ${currentQuestion}/${totalQuestions}`;
      currentInput = "";
      answerBox.textContent = "?";
      answerBox.className = "answer-display";

      if (selectedTable === 'all') {
        num1 = Math.floor(Math.random() * 10) + 1;
        num2 = Math.floor(Math.random() * 10) + 1;
      } else {
        num1 = parseInt(selectedTable);
        num2 = Math.floor(Math.random() * 10) + 1;
      }

      questionText.textContent = `${num2} × ${num1} =`;
    }

    // Invoer afhandeling
    function addDigit(digit) {
      if (isChecking) return;
      if (currentInput.length >= 4) return;
      currentInput += digit;
      answerBox.textContent = currentInput;
    }

    function removeDigit() {
      if (isChecking) return;
      currentInput = currentInput.slice(0, -1);
      answerBox.textContent = currentInput === "" ? "?" : currentInput;
    }

    function checkAnswer() {
      if (isChecking || currentInput === "") return;
      isChecking = true;

      const userAns = parseInt(currentInput, 10);
      const correctAns = num1 * num2;

      if (userAns === correctAns) {
        score++;
        answerBox.classList.add('correct');
        setTimeout(nextQuestion, 600);
      } else {
        answerBox.classList.add('wrong');
        answerBox.textContent = correctAns; // Toon het juiste antwoord
        setTimeout(nextQuestion, 1500);
      }
    }

    // Numpad klik events
    document.querySelectorAll('.num-btn[data-val]').forEach(btn => {
      btn.addEventListener('click', () => addDigit(btn.dataset.val));
    });

    document.getElementById('btn-back').addEventListener('click', removeDigit);
    document.getElementById('btn-ok').addEventListener('click', checkAnswer);

    // Fysiek toetsenbord ondersteuning
    window.addEventListener('keydown', (e) => {
      if (screenGame.style.display !== 'flex') return;
      if (e.key >= '0' && e.key <= '9') {
        addDigit(e.key);
      } else if (e.key === 'Backspace') {
        removeDigit();
      } else if (e.key === 'Enter') {
        checkAnswer();
      }
    });

    // Eindscherm
    function showResults() {
      screenGame.style.display = 'none';
      screenResults.style.display = 'flex';
      statsEl.textContent = "Klaar!";
      resultScore.textContent = `${score} / ${totalQuestions}`;

      if (score === totalQuestions) {
        resultMsg.textContent = "Fantastisch! Een perfecte score! 🏆";
      } else if (score >= 7) {
        resultMsg.textContent = "Super goed geoefend! Ga zo door. ⭐";
      } else {
        resultMsg.textContent = "Blijven oefenen, je wordt vanzelf sneller! 💪";
      }
    }
  </script>
</body>
</html>
